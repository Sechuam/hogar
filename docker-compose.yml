# Desarrollo local.
#   Solo BD:      docker compose up -d db
#   App + BD:     docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hogar}
      POSTGRES_USER: ${DB_USERNAME:-hogar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-hogar}
      DB_USERNAME: ${DB_USERNAME:-hogar}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      STORAGE_DIR: /app/storage
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - invoices:/app/storage

volumes:
  db-data:
  invoices:
