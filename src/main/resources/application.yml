# Configuración común. Los secretos SOLO llegan por variables de entorno
# (o por un fichero .env local, ignorado por git; ver .env.example).
spring:
  application:
    name: hogar-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hogar}
    username: ${DB_USERNAME:hogar}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    # Sin usuario en memoria con contraseña generada: la autenticación es solo por JWT.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      # {"role": 0} no debe significar OWNER: los enums solo se aceptan por nombre.
      fail-on-numbers-for-enums: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Cabecera de cada parte multipart (512 B por defecto): un nombre de fichero no ASCII largo
    # la superaba y Spring lo reportaba como "fichero demasiado grande".
    max-part-header-size: 4KB
  error:
    include-stacktrace: never
    include-message: never

management:
  # Actuator en un puerto aparte, no publicado fuera de la red interna (ver docker-compose.yml y
  # ManagementSecurityConfig). En el puerto de la aplicación solo quedan las probes /livez y /readyz.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # Se añade al patrón de consola por defecto (perfiles con logs legibles: dev, test).
  pattern:
    correlation: "[%X{requestId:-}] "

hogar:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: hogar-api
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    google:
      # Client IDs de la app (Android/iOS/Web) aceptados como 'aud' del ID token de Google.
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    rate-limit:
      # Intentos por clave (IP + email) en login/registro/google, recargados cada refill-period.
      capacity: 5
      refill-period: 1m
      # Cupo por IP sumando todos los emails (enumeración / password spraying).
      ip-capacity: 30
  invitations:
    default-ttl: 7d
    max-ttl: 30d
  invoices:
    # Límite de la aplicación; el de multipart (arriba) es la primera barrera.
    max-size: 10MB
  storage:
    local:
      # Directorio de las facturas en disco (en Docker, el volumen 'invoices').
      base-dir: ${STORAGE_DIR:./storage}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# Fuera de dev y test (Docker, producción): logs JSON estructurados en formato ECS
# (Elastic Common Schema), con service.name y las claves del MDC (requestId) como campos.
spring:
  config:
    activate:
      on-profile: "!dev & !test"
logging:
  structured:
    format:
      console: ecs
